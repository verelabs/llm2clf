[project]
name = "llm2clf"
version = "0.1.0"
description = "Jev-compatible typed judgments (Noul, Choice, Score) from any open-weights LLM, read from next-token probabilities"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "transformers>=4.57",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "boto3>=1.43.101",
]

[project.optional-dependencies]
hf = ["torch>=2.5", "accelerate>=1.0"]

[project.scripts]
llm2clf-serve = "llm2clf.server:main"

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
